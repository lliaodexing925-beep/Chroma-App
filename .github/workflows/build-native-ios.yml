name: Build native iOS IPA

on:
  push:
    paths:
      - "YikeMoment/**"
      - "scripts/generate_icon.py"
      - ".github/workflows/build-native-ios.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "创建 GitHub Release 附件"
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Generate app icon
        run: |
          python3 -m pip install --user pillow --quiet
          python3 scripts/generate_icon.py

      - name: Build unsigned app
        run: |
          cd YikeMoment
          xcodebuild -project YikeMoment.xcodeproj \
            -scheme YikeMoment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_DIR="YikeMoment/build/Build/Products/Release-iphoneos"
          ls "$APP_DIR"
          mkdir -p out/Payload
          cp -R "$APP_DIR/YikeMoment.app" out/Payload/
          cd out
          zip -qry "../YikeMoment-native.ipa" Payload
          cd ..
          shasum -a 256 YikeMoment-native.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YikeMoment-native-ipa
          path: native/YikeMoment-native.ipa

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-v2.0.0-${{ github.run_number }}
          name: 一刻 2.0.0 原生版（未签名）
          files: native/YikeMoment-native.ipa
          generate_release_notes: false
