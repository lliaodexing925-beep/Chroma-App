<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f2">
  <title>一刻 · 正在进入</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f2f2f2;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;padding:calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom))}
    .card{width:min(100%,440px);padding:32px 26px;border:1px solid #e2e2e6;border-radius:24px;background:#fff}
    .mark{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:#1d1d1f;color:#f5f5f7;font-size:29px}.eyebrow{margin:24px 0 7px;color:#417d54;font-size:10px;font-weight:700;letter-spacing:.2em}
    h1{margin:0;font-size:32px;line-height:1.25;letter-spacing:-.03em}p{color:#6e6e73;font-size:14px;line-height:1.8}form{display:grid;gap:13px;margin-top:26px}label{font-size:12px;font-weight:650}
    input{width:100%;height:52px;padding:0 16px;border:1px solid #d8d8dd;border-radius:14px;background:#f7f7f8;color:#1d1d1f;font:inherit;font-size:14px;outline:none}
    input:focus{border-color:#417d54;outline:2px solid rgba(65,125,84,.18)}button{min-height:50px;border:0;border-radius:999px;background:#1d1d1f;color:#f5f5f7;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.secondary{margin-top:12px;background:#f2f2f2;color:#1d1d1f}.error{min-height:20px;margin:0;color:#b84646}.hint,footer{font-size:12px}.host{overflow-wrap:anywhere;color:#417d54;margin:20px 0}.saved{display:none}footer{margin-top:24px;color:#6e6e73;text-align:center;line-height:1.8}
    @media(prefers-color-scheme:dark){html,body{background:#000;color:#f5f5f7}.card{background:#1c1c1e;border-color:#38383d}.mark{background:#f5f5f7;color:#1d1d1f}input{background:#2c2c2e;border-color:#48484d;color:#f5f5f7}.secondary{background:#2c2c2e;color:#f5f5f7}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">一</div><p class="eyebrow">MOMENT · iOS</p>
    <section id="setup">
      <h1>连接你的「一刻」</h1>
      <p>第一次使用，请填写已经发布的「一刻」公开网址。网址会保存在这台设备里，下次打开自动进入。</p>
      <form id="url-form">
        <label for="public-url">公开网址</label>
        <input id="public-url" type="url" inputmode="url" autocomplete="url" placeholder="https://你的名字.kimi.site" required>
        <p class="error" id="error" role="alert"></p>
        <button type="submit">保存并进入一刻</button>
      </form>
      <p class="hint">请填写完整网址，包括 https://。云端数据仍保存在你的「一刻」账号中。</p>
    </section>
    <section class="saved" id="saved">
      <h1>正在回到「一刻」</h1><p>将打开已保存的云端地址。</p>
      <div class="host" id="saved-host"></div>
      <button id="enter-now" type="button">立即进入</button>
      <button class="secondary" id="change-url" type="button">更改网址</button>
    </section>
    <footer>未签名 iOS 版本 · 需要联网同步数据<br>开启通知后，提醒可由系统按时弹出</footer>
  </main>
  <script>
    (() => {
      const key="yike.publicUrl.v1",defaultUrl="https://fk7r34dc6j2de.kimi.site",setup=document.getElementById("setup"),saved=document.getElementById("saved"),input=document.getElementById("public-url"),error=document.getElementById("error");
      let timer;
      function validate(value){
        const url=new URL(value.trim()),validHost=url.hostname==="ok.kimi.link"||url.hostname.endsWith(".ok.kimi.link")||url.hostname==="kimi.site"||url.hostname.endsWith(".kimi.site");
        if(url.protocol!=="https:"||!validHost||url.username||url.password)throw new Error("请输入有效的「一刻」公开网址，例如 https://名字.kimi.site");
        return url.origin+url.pathname.replace(/\/$/,"");
      }
      function enter(){clearTimeout(timer);const url=localStorage.getItem(key);if(url)window.location.replace(url)}
      function showSaved(){const url=localStorage.getItem(key);if(!url)return;setup.style.display="none";saved.style.display="block";document.getElementById("saved-host").textContent=url;timer=setTimeout(enter,1600)}
      document.getElementById("url-form").addEventListener("submit",event=>{event.preventDefault();error.textContent="";try{const url=validate(input.value);localStorage.setItem(key,url);window.location.assign(url)}catch(e){error.textContent=e.message||"网址格式不正确";input.focus()}});
      document.getElementById("enter-now").addEventListener("click",enter);
      document.getElementById("change-url").addEventListener("click",()=>{clearTimeout(timer);localStorage.removeItem(key);saved.style.display="none";setup.style.display="block";input.value="";input.focus()});
      if(!localStorage.getItem(key))localStorage.setItem(key,defaultUrl);
      showSaved();
    })();
  </script>
</body>
</html>
